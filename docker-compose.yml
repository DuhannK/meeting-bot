# ── Çalışma modeli (worker-per-meeting) ─────────────────────────────────────
# Bu compose artık yalnızca STANDING ALTYAPIYI ayağa kaldırır: redis + minio +
# createbuckets. Kayıt botunun kendisi ARTIK burada uzun ömürlü çalışmaz; ana
# proje (beetinq) her (çakışan) toplantı için `meeting-bot:worker` imajından
# Docker ile bir EPHEMERAL worker konteyneri başlatır, iş bitince `--rm` siler.
# Eş zamanlılık = aynı anda çalışan worker sayısı; eş zamanlı Teams konteyner
# izolasyonuyla (her worker kendi ekranı + ses sink'i) sorunsuz çalışır.
#
# Kullanım:
#   docker compose up -d                       # altyapı (redis, minio)
#   docker compose --profile build build       # meeting-bot:worker imajını üret
#   (workers'ı backend başlatır — buradan elle up etmeye gerek yok)
#
# Eski tek-konteyner "classic" mod hâlâ mevcut (test/geri dönüş için):
#   docker compose --profile classic up --build
services:
  redis:
    image: redis:7-alpine
    # Host-published port is configurable via REDIS_PORT_HOST (default 6379) so it
    # can dodge another local Redis already using :6379:
    #   REDIS_PORT_HOST=6380 docker compose up
    # Workers reach Redis over host.docker.internal:${REDIS_PORT_HOST} (event bus).
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cache:/data

  # Local S3-compatible object storage. Worker konteynerleri audio-only kaydı
  # buraya yükler; downstream analiz projesi (WhisperX) aynı bucket'tan çeker.
  minio:
    image: minio/minio:latest
    platform: linux/amd64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - minio_data:/data

  # One-shot: wait for MinIO, then ensure the recordings bucket exists. Exits 0.
  createbuckets:
    image: minio/mc:latest
    platform: linux/amd64
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-meeting-recordings}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb -p local/$${S3_BUCKET_NAME};
      echo 'bucket ready:' $${S3_BUCKET_NAME};
      exit 0;
      "

  # ── Worker imajını BUILD etmek için (çalıştırmaz) ─────────────────────────
  # `docker compose --profile build build` bu imajı üretir; backend
  # `docker run meeting-bot:worker` ile toplantı başına başlatır.
  meeting-bot-worker:
    profiles: ["build"]
    image: meeting-bot:worker
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["true"] # asla standing çalışmaz; yalnızca imaj build hedefi

  # ── (classic) Eski tek-konteyner mod — varsayılan başlamaz ────────────────
  # Geri dönüş / izole test için. `--profile classic up` ile çalışır.
  meeting-bot:
    profiles: ["classic"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.development
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=${REDIS_HOST:-redis}
      - GOOGLE_CHROME_CDP_URL=${GOOGLE_CHROME_CDP_URL-http://chrome-cdp:9223}
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - ./.chrome:/usr/src/app/.chrome
      - ./assets/screenshots:/usr/src/app/assets/screenshots
      - ./debug-videos:/usr/src/app/debug-videos
      - /usr/src/app/node_modules  # Persist node_modules
    command: ["/bin/bash", "./start.sh"]
    depends_on:
      redis:
        condition: service_healthy
      chrome-cdp:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  # (classic) Real Google Chrome + Xvfb over CDP — only used by the classic mode.
  chrome-cdp:
    profiles: ["classic"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.chrome-cdp
    shm_size: "1gb"
    expose:
      - "9223"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 3s
      retries: 20


volumes:
  cache:
  minio_data:
